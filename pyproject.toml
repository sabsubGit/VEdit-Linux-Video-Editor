[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vedit"
version = "0.1.0"
description = "A simple, fast video editor for Linux"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "av>=14",
    # The player converts frames and audio blocks through numpy; it is a hard
    # runtime dependency, not a test-only one.
    "numpy>=1.24",
]

[project.optional-dependencies]
# `pip install -e ".[dev]"` for the test suite. The slow tests also shell out to
# a real ffmpeg, which pip cannot install.
dev = ["pytest>=8"]

[project.scripts]
vedit = "vedit.__main__:main"

[tool.setuptools.packages.find]
include = ["vedit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs real ffmpeg renders"]
